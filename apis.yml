aid: citrix-sharefile
name: Citrix ShareFile
description: >-
  ShareFile (now part of Progress Software) is a secure document workflow and
  file sharing platform that lets teams share files, collect e-signatures,
  request data from clients, and automate document-centric workflows. The
  ShareFile v3 REST API provides programmatic access to items, folders,
  files, users, groups, shares, capabilities, and workflows in a customer
  subdomain, secured with OAuth 2.0.
