- aid: citrix-sharefile:rest-api-v3
  name: ShareFile REST API v3
  description: >-
    REST API for ShareFile providing access to items, folders, files, users, groups, shares, devices,
    accounts, and workflows. Authentication uses OAuth 2.0 with multiple supported grant types including
    authorization code, password, and SAML assertion exchange, returning Bearer access tokens scoped to
    a customer subdomain.
  humanURL: https://api.sharefile.com/
  baseURL: https://{subdomain}.sf-api.com/sf/v3
